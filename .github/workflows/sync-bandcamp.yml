name: Refresh Bandcamp charts

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bandcamp-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh collection and charts
        run: python scripts/import_bandcamp.py okefm

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- dist/data/bandcamp.json; then
            echo "Bandcamp data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/bandcamp.json
          git commit -m "Refresh Bandcamp collection and charts"
          git push
